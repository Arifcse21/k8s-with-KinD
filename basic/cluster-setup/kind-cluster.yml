kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: apac-cluster
nodes:
- role: control-plane
  extraMounts: &docker-sock-mount
  - hostPath: /var/run/docker.sock
    containerPath: /var/run/docker.sock
    readOnly: false
- &worker-node
  role: worker
  extraMounts: *docker-sock-mount
- *worker-node
- *worker-node