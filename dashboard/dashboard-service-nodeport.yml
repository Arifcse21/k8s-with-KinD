apiVersion: v1
kind: Service
metadata:
  name: kubernetes-dashboard
  namespace: kubernetes-dashboard
  labels:
    k8s-app: kubernetes-dashboard
spec:
  type: NodePort  # Makes it accessible from your laptop
  ports:
  - port: 443
    targetPort: 8443
    nodePort: 30443  # You'll access at https://localhost:30443
    protocol: TCP
  selector:
    k8s-app: kubernetes-dashboard