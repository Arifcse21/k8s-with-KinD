kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: apac-cluster
nodes:
- role: control-plane
  extraMounts: &docker-sock-mount
  - hostPath: /var/run/docker.sock
    containerPath: /var/run/docker.sock
    readOnly: false
  extraPortMappings:
  - containerPort: 30080
    hostPort: 30080
    protocol: TCP
- role: worker
  extraMounts: *docker-sock-mount
- role: worker
  extraMounts: *docker-sock-mount
- role: worker
  extraMounts: *docker-sock-mount
